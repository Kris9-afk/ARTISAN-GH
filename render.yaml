services:
  - type: web
    name: artisan-gh-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://artisan-gh.onrender.com
